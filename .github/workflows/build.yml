name: Compilar EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Clonar o código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Criar o Arquivo EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "MonitorRede" monitor.py

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Programa-Monitor-Rede
        path: dist/MonitorRede.exe
